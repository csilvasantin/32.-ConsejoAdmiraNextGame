<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<title>Qué estamos gastando · admira.live</title>
<meta name="description" content="Lo que cuestan las cuentas del equipo, en español claro, con la fecha de cada lectura.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#02080d">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://www.carlossilva.info/admira-design/tokens.css">
<link rel="stylesheet" href="/yk-frame.css?v=r21">
<style>
:root{--bg:#02080d;--card:#0a1620;--ink:#dff8ff;--mut:#75aab9;--dim:#4d7a88;--brand:#78f3ff;--line:rgba(120,243,255,.16);--sans:var(--admira-font-sans,-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{width:100%;max-width:880px;margin:0 auto;padding:20px 16px 72px}
.lead,.resumen li,.nombre,.cuenta,.frase,.unidad,.detalle li,.cuando,.pie{overflow-wrap:break-word}
.top{min-width:0}
.top > div{min-width:0}
nav{display:flex;flex-wrap:wrap;gap:14px;padding:4px 0 18px}
nav a{color:var(--brand);text-decoration:none;font-size:15px}
h1{font-size:clamp(28px,7vw,40px);letter-spacing:-.03em;line-height:1.1;margin:0 0 8px}
.lead{color:var(--mut);font-size:17px;line-height:1.45;margin-bottom:18px}
.resumen{background:#14080c;border:1px solid rgba(255,90,90,.45);border-radius:16px;padding:16px 16px 8px;margin-bottom:18px}
.resumen h2{font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#ffb4b4;margin-bottom:8px}
.resumen li{margin:0 0 10px 18px;font-size:17px;line-height:1.4}
.grid{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.nombre{font-size:20px;line-height:1.2}
.cuenta{color:var(--dim);font-size:14px;margin-top:4px}
.luz{flex:none;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.luz.rojo{background:#ff5a5a;color:#2a0000}
.luz.ambar{background:#ffd866;color:#2a1c00}
.luz.verde{background:#88ffaa;color:#04210c}
.luz.sin{background:#24343c;color:#dff8ff}
.cifra{font-size:clamp(40px,12vw,64px);letter-spacing:-.04em;line-height:1;margin:14px 0 4px;font-variant-numeric:tabular-nums}
.unidad{color:var(--mut);font-size:16px;margin-bottom:10px}
.frase{font-size:17px;line-height:1.45}
.detalle{margin:12px 0 0;padding:0;list-style:none}
.detalle li{color:var(--mut);font-size:15px;line-height:1.4;margin-top:8px}
.cuando{margin-top:12px;color:var(--dim);font-size:14px}
.nota{color:var(--mut);font-size:16px;line-height:1.45;padding:16px;border:1px dashed var(--line);border-radius:14px}
.pie{margin-top:22px;color:var(--dim);font-size:14px;line-height:1.45}
.pie a{color:var(--brand)}
@media (min-width:720px){
  .wrap{padding:32px 24px 80px}
  .grid{grid-template-columns:1fr 1fr}
  .card.ancho{grid-column:1 / -1}
}
@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto;transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="/">Inicio</a>
    <a href="/consumo">Agentes</a>
    <a href="/consumos-proyectos">Gasto por proyecto</a>
  </nav>
  <h1>Qué estamos gastando</h1>
  <p class="lead">Una tarjeta por cuenta. El color dice si hay que actuar. La fecha es el momento de la lectura, no de ahora mismo.</p>
  <section class="resumen" id="resumen" hidden>
    <h2>Lo urgente</h2>
    <ol id="lineas"></ol>
  </section>
  <div class="grid" id="grid"><p class="nota">Cargando las lecturas…</p></div>
  <p class="pie" id="pie"></p>
</div>
<script>
const LUZ = { rojo: "Rojo", ambar: "Ámbar", verde: "Verde", sin: "Sin lectura" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function pinta(datos) {
  const lineas = Array.isArray(datos.resumen) ? datos.resumen.slice(0, 3) : [];
  const resumen = document.getElementById("resumen");
  if (lineas.length) {
    document.getElementById("lineas").innerHTML = lineas.map((t) => "<li>" + esc(t) + "</li>").join("");
    resumen.hidden = false;
  }
  const plats = Array.isArray(datos.plataformas) ? datos.plataformas : [];
  const grid = document.getElementById("grid");
  if (!plats.length) {
    grid.innerHTML = '<p class="nota">Sin lectura todavía.</p>';
    return;
  }
  grid.innerHTML = plats.map((p) => {
    const luz = LUZ[p.semaforo] ? p.semaforo : "sin";
    const cifra = String(p.cifra || "").trim() || "sin lectura todavía";
    const detalle = (p.detalle || []).map((t) => "<li>" + esc(t) + "</li>").join("");
    const ancho = (p.detalle || []).length > 1 ? " ancho" : "";
    return '<article class="card' + ancho + '">' +
      '<div class="top"><div><h2 class="nombre">' + esc(p.nombre) + '</h2><p class="cuenta">' + esc(p.cuenta) + '</p></div>' +
      '<span class="luz ' + luz + '">' + LUZ[luz] + '</span></div>' +
      '<p class="cifra">' + esc(cifra) + '</p>' +
      (p.unidad ? '<p class="unidad">' + esc(p.unidad) + '</p>' : '') +
      '<p class="frase">' + esc(p.frase) + '</p>' +
      (detalle ? '<ul class="detalle">' + detalle + '</ul>' : '') +
      '<p class="cuando">Lectura: ' + esc(p.leido || "sin lectura todavía") + '</p>' +
      '</article>';
  }).join("");
  const pie = document.getElementById("pie");
  pie.innerHTML = esc(datos.como_actualizar || "") + ' <a href="/consumos-plataformas.json">Archivo de lecturas</a>.';
}

fetch("/consumos-plataformas.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("sin archivo"); return r.json(); })
  .then(pinta)
  .catch(() => {
    document.getElementById("grid").innerHTML = '<p class="nota">Sin lectura todavía. No se ha podido abrir el archivo de lecturas.</p>';
  });
</script>
<script src="/yk-frame.js?v=r34"></script>
</body>
</html>
