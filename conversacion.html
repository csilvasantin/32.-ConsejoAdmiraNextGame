<!DOCTYPE html>
<html lang="es">
<head>
<script src="/auth-gate.js?v=20261004-r15-sinfranja"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversación · AdmiraNeXT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#02080d">
<link rel="icon" href="/council-icon.ico?v=20260522-r1" sizes="any">
<link rel="stylesheet" href="/yk-quien.css?v=20261004-quien">
<style>
:root{--bg:#02080d;--card:#0a1620;--ink:#dff8ff;--mut:#75aab9;--dim:#4d7a88;--brand:#78f3ff;--accent:#ffd866;--good:#88ffaa;--warn:#ff8866;--line:rgba(120,243,255,.16);--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px}
.back{margin:0 0 8px}
.back a{color:var(--brand);text-decoration:none;font:700 13px/1 var(--mono);letter-spacing:.04em;min-height:44px;display:inline-flex;align-items:center}
h1{font-size:clamp(26px,6vw,34px);letter-spacing:-.03em;margin:0 0 6px}
.lead{margin:0 0 16px;color:var(--mut);font-size:15px}
.note{margin:8px 0 0;color:var(--dim);font-size:13px}
.feed{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.msg header{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;margin-bottom:6px}
.who{font-weight:700;color:var(--brand)}
.who .to{color:var(--accent);font-weight:650}
.src{font:700 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.when{margin-left:auto;color:var(--dim);font:12px/1.2 var(--mono)}
.text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font:700 11px/1.2 var(--mono);letter-spacing:.02em;color:#02080d;background:var(--accent);border-radius:999px;padding:4px 8px}
.tag.proy{background:var(--brand)}
.tag.est{background:var(--good)}
.empty{color:var(--mut);padding:18px 4px}
@media (max-width:375px){
  .wrap{padding:14px 12px 36px}
  .when{margin-left:0}
  .msg{padding:12px}
}
</style>
<script src="/admira-idioma.js"></script><!-- idioma ES/EN · ?lang=en · /idioma ENG (10-10-2026) -->
</head>
<body>
<div class="wrap">
  <p class="back"><a href="/">← Consejo</a></p>
  <h1>Conversación</h1>
  <p class="lead">Charla de los coetáneos y encargos del equipo. Lo más reciente primero, con el proyecto, la misión o la tarea cuando consta.</p>
  <div id="quien"></div>
  <p class="note" id="note" hidden></p>
  <div class="feed" id="feed" aria-live="polite">Cargando la conversación…</div>
</div>
<script src="/yk-quien.js?v=20261004-quien"></script>
<script src="/yk-quien-ui.js?v=20261004-quien"></script>
<script src="/conversacion.js?v=20261004-conversacion"></script>
<script>
(function () {
  var AGORA = "https://macmini.tail48b61c.ts.net/api/agora/coetaneos?limit=60";
  var INBOX = "https://bot.yokup.com/api/public/inbox";
  var feedEl = document.getElementById("feed");
  var noteEl = document.getElementById("note");
  var entries = [];
  var notes = [];

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function tags(entry) {
    var bits = [];
    if (entry.project_id) bits.push('<span class="tag proy">' + esc(entry.project_id) + "</span>");
    if (entry.etiqueta) bits.push('<span class="tag">' + esc(entry.etiqueta) + "</span>");
    if (entry.task_id) bits.push('<span class="tag">' + esc(entry.task_id) + "</span>");
    var estado = Conversacion.statusLabel(entry.status);
    if (estado) bits.push('<span class="tag est">' + esc(estado) + "</span>");
    return bits.length ? '<div class="tags">' + bits.join("") + "</div>" : "";
  }

  function render() {
    var sel = QUIEN.get();
    var rows = Conversacion.filterFeed(entries, sel);
    if (!rows.length) {
      feedEl.innerHTML = '<p class="empty">' + (entries.length ? "Nada de esta persona en la conversación reciente." : "Sin mensajes ahora mismo.") + "</p>";
      return;
    }
    feedEl.innerHTML = rows.map(function (entry) {
      var from = Conversacion.displayName(entry.from_name) || "alguien";
      var to = entry.target_persona ? Conversacion.displayName(entry.target_persona) : "";
      var when = entry.ts && window.YkQuien ? YkQuien.hace(entry.ts, Date.now()) : "";
      var who = esc(from) + (to ? ' <span class="to">→ ' + esc(to) + "</span>" : "");
      return '<article class="msg"><header><span class="who">' + who + '</span><span class="src">' + esc(entry.source) + '</span>' +
        (when ? '<span class="when">' + esc(when) + "</span>" : "") +
        "</header><p class=\"text\">" + esc(entry.text) + "</p>" + tags(entry) + "</article>";
    }).join("");
  }

  var QUIEN = YkQuienUI.mount(document.getElementById("quien"), { onChange: render });

  function remember(names) {
    var seen = QUIEN.extras();
    names.forEach(function (name) { if (name) seen.push(name); });
    QUIEN.setSeen(seen);
  }

  Promise.all([
    fetch(AGORA, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("charla"); return r.json(); }).catch(function () { notes.push("La charla de coetáneos no ha respondido."); return { feed: [] }; }),
    fetch(INBOX, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("inbox"); return r.json(); }).catch(function () { notes.push("La bandeja de encargos no ha respondido."); return { items: [] }; })
  ]).then(function (pair) {
    var agora = (pair[0] && pair[0].feed) || [];
    var inbox = (pair[1] && pair[1].items) || [];
    entries = Conversacion.buildFeed(agora, inbox);
    var names = [];
    entries.forEach(function (entry) {
      names.push(entry.from_name, entry.target_persona);
    });
    remember(names);
    if (notes.length) {
      noteEl.hidden = false;
      noteEl.textContent = notes.join(" ");
    }
    render();
  });
})();
</script>
</body>
</html>
