<!DOCTYPE html>
<html lang="es">
<head>
<script src="/auth-gate.js?v=20261004-r15-sinfranja"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepAgents · AdmiraNeXT</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#02080d">
<link rel="icon" href="/council-icon.ico?v=20260522-r1" sizes="any">
<link rel="stylesheet" href="/yk-frame.css?v=20261121-r224-sin-idioma">
<link rel="stylesheet" href="/deepagents/deepagents.css?v=20261121-r9">
<script src="/admira-idioma.js"></script>
</head>
<body data-yk-title="DEEPAGENTS" data-yk-zone="app">
<div class="wrap">
  <!-- Carlos, 21-11-2026: fuera el rótulo de canal que iba sobre el título. Una línea: DeepAgents, la flecha
       que despliega el texto (contraído por defecto) y, a la misma altura, la hora de lectura de los agentes. -->
  <header class="cab">
    <div class="cab-linea">
      <h1>DeepAgents</h1>
      <button type="button" class="plegar" id="da-plegar" aria-expanded="false" aria-controls="da-lead"
        title="Qué es DeepAgents" aria-label="Mostrar qué es DeepAgents">▸</button>
      <span class="lectura" id="lectura-hora" aria-live="polite">Leyendo los agentes…</span>
    </div>
    <div class="estado" id="estado" aria-live="polite">
      <span class="led" id="led"></span><span id="estado-txt">Cargando…</span>
    </div>
    <p class="lead" id="da-lead" hidden>Qué está haciendo ahora cada deepagent principal y, debajo, todo lo que se dicen con los consejeros.</p>
  </header>

  <!-- Carlos, 21-11-2026 (r229): fuera el rótulo «Ahora · flota leída a las…» (la hora ya va en la cabecera). -->
  <section aria-label="Deepagents fijos">
    <div class="ahora" id="ahora" aria-live="polite"><p class="empty">Leyendo la flota…</p></div>
    <p class="nota" id="ahora-nota" hidden></p>
  </section>

  <div class="ahora-cab"><h2>Mensajes con los consejeros</h2><a class="enl" href="/comunicaciones">Consejeros entre sí · Leyendas ↔ Coetáneos →</a></div>
  <section class="cifras" id="cifras" aria-label="Resumen"></section>

  <section aria-label="Parejas">
    <h2>Parejas</h2>
    <div class="parejas" id="parejas"></div>
  </section>

  <section aria-label="Acciones en los equipos" id="sec-acciones" hidden>
    <h2>Acciones en los equipos</h2>
    <div class="acciones" id="acciones"></div>
  </section>

  <section aria-label="Registro">
    <div class="barra">
      <h2>Registro</h2>
      <label class="campo"><span>Agente</span><select id="f-agente"><option value="">Todos</option></select></label>
      <label class="campo"><span>Consejero</span><select id="f-consejero"><option value="">Todos</option></select></label>
      <label class="campo crece"><span>Buscar</span><input id="f-q" type="search" placeholder="texto, máquina, nombre…" autocomplete="off"></label>
      <label class="campo marca"><input id="f-pend" type="checkbox"><span>Solo sin leer</span></label>
    </div>
    <p class="nota" id="nota" hidden></p>
    <div class="feed" id="feed" aria-live="polite"></div>
  </section>

  <footer class="pie" id="pie"></footer>
</div>
<script src="/assets/deepagents-estado.js?v=20261121-r1"></script>
<script src="/deepagents/deepagents.js?v=20261121-r9"></script>
<script src="/yk-frame.js?v=20261121-r224-sin-idioma"></script>
</body>
</html>
