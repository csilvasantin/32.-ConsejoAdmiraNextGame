      button.type="button"; button.setAttribute("aria-expanded","false"); button.setAttribute("aria-controls",detail.id);
      button.addEventListener("click",function(){ detail.hidden=!detail.hidden; button.setAttribute("aria-expanded",String(!detail.hidden)); });
      hour.events.forEach(function(event){ detail.appendChild(el("li","",event.type+" · "+event.detail)); }); row.append(time,bar,button,detail); list.appendChild(row); });
    panel.appendChild(list); if (!complete) panel.appendChild(el("p","empty","Evolución parcial: una o más fuentes de datos no están disponibles.")); return panel;
  }
  function scoreEvolutionPanel(history, complete) {
    var panel=el("section","panel score-evolution"), heading=el("h2","","Evolución de puntos · últimos 30 días"); panel.appendChild(heading);
    if (!complete || !history) { panel.appendChild(el("p","empty","Histórico no disponible: no se muestran ceros en sustitución de datos ausentes.")); return panel; }
    var days=history.evolution||[], list=el("div","score-days"); list.setAttribute("role","list");
    if (!days.length) { panel.appendChild(el("p","empty","No hay días verificables en la serie histórica.")); return panel; }
    var max=Math.max.apply(null,days.map(function(row){return row.points;}));
    days.forEach(function(row){ var line=el("div","score-day"), time=el("time","",row.day.slice(8,10)+"/"+row.day.slice(5,7)),bar=el("div","score-day-bar"),fill=el("i"),points=el("b","",row.points+" pts");
      line.setAttribute("role","listitem"); line.setAttribute("aria-label",row.day+": "+row.points+" puntos"); time.dateTime=row.day;
      fill.style.width=(max?row.points/max*100:0)+"%"; bar.appendChild(fill); line.append(time,bar,points); list.appendChild(line); });
    panel.appendChild(list); panel.appendChild(el("p","score-sampled","Datos canónicos muestreados el "+new Date(history.sampledAt).toLocaleString("es-ES",{timeZone:"Europe/Madrid"})+".")); return panel;
  }
  function render(data) {
    var identitySourcesAvailable=data.available.daily||data.available.tasks||data.available.missions||data.available.incidents;
    var known = !!data.history || !!data.snap || data.daily.scores.some(function(row){ return DETAIL.sameFamily(row.agent,row.machine,agent,ID); }) ||
      data.tasks.some(function(t){ return DETAIL.sameFamily(DETAIL.taskIdentity(t,ID),t.loc,agent,ID); }) ||
      data.missions.some(function(m){ return DETAIL.sameFamily(m.assignee||m.persona,m.machine||m.loc,agent,ID); }) ||
      data.incidents.some(function(i){ return DETAIL.sameFamily(i.assignee||i.persona||i.agent,i.machine||i.loc,agent,ID); });
    if (!known && !identitySourcesAvailable) { state("Datos no disponibles", "No se pudo comprobar esta identidad porque las fuentes del Highscore no están disponibles."); return; }
    if (!known) { state("Agente no encontrado", "La identidad solicitada no aparece en el marcador ni en los datos operativos disponibles."); return; }
    var calculated=DETAIL.scoreFor(agent,data.daily,data.tasks,ID), rank=DETAIL.ranking(agent,data.daily,data.tasks,ID), snap=data.snap, history=data.history;
    var place=snap&&Number(snap.posicion)||rank.place||"—", total=snap&&Number(snap.total);
    if (!Number.isFinite(total)) total=data.available.daily&&data.available.tasks?calculated.total:"—";
    var taskCount=data.available.tasks?calculated.taskCount:"—";
    // Nº de ventanas de decisión que lleva hoy este agente (Carlos, 3-sep-2026): el
    // snapshot del ranking trae «ventanas»; si no, se cuenta de /highscore/daily.
    var windowCount=snap&&Number.isFinite(Number(snap.ventanas))?Number(snap.ventanas):(data.available.daily?calculated.windowCount:"—");
    var fact=DETAIL.facts(agent,data.tasks,data.missions,data.incidents,ID), hours=DETAIL.timeline(agent,data.tasks,data.missions,data.incidents,ID);
    target.replaceChildren(); var hero=el("header","hero"), avatar=el("div","avatar",agent.charAt(0).toUpperCase()), avatarUrl=window.ykAvatar&&window.ykAvatar.img(agent);
    if (avatarUrl) { var image=document.createElement("img"); image.src=avatarUrl; image.alt="Avatar de "+agent; image.addEventListener("error",function(){ image.remove(); avatar.textContent=agent.charAt(0).toUpperCase(); }); avatar.replaceChildren(image); }
    var identity=el("div"), eyebrow=el("div","eyebrow","Identidad canónica"), title=el("h1","",agent), source=el("p","source",history?"Histórico factual por periodos naturales de Europe/Madrid; identidad y equipo exactos.":(snap?"Puesto y puntos del snapshot exacto del Highscore.":"Puesto reconstruido con actividad atribuible directamente; no se reasignan datos sin equipo."));
    identity.append(eyebrow,title,source); hero.append(avatar,identity); target.appendChild(hero);
    var stats=el("section","stats"), scoreAvailable=!!snap||data.available.daily;
    stats.append(stat(place,"Puesto"),stat(total,"Puntos hoy"),stat(history?history.periods.week.points:"—","Semana · lunes a hoy"),
      stat(history?history.periods.month.points:"—","Mes · día 1 a hoy"),stat(history?history.periods.total.points:"—","Total histórico"),
      stat(snap?snap.tareas:taskCount,"Tareas hoy"),stat(windowCount,"Ventanas de decisión hoy")); target.appendChild(stats);
    // CUÁNTO FALTA HASTA SU PRÓXIMA VENTANA (Carlos, 2026-08-07). El dato lo da
    // /fleet/turnos, que cruza las dos condiciones —su hora cumplida Y su turno
    // dentro del reparto— y devuelve la más tardía. Se pide aparte y en
    // silencio: si no responde, el detalle se pinta igual sin esta franja.
    target.appendChild(turnoPanel(agent));
    var operationalComplete=data.available.tasks&&data.available.missions&&data.available.incidents;
    var grid=el("div","grid"); grid.append(factsPanel("Lo que hizo bien",fact.good,"No hay hechos positivos verificables en los datos disponibles.",operationalComplete),
      factsPanel("A mejorar",fact.improve,"No hay pendientes o incidencias atribuibles en los datos disponibles.",operationalComplete),
      timelinePanel(hours,operationalComplete),scoreEvolutionPanel(history,data.available.history)); target.appendChild(grid);
  }
  if (!agent) { state("Falta el agente", "Abre el detalle desde uno de los tres puestos del podio o añade ?agent=<identidad-canónica>."); return; }
  if (!DETAIL.validAgent(agent,ID)) { state("Identidad no válida", "El parámetro agent debe contener una identidad canónica con apellido de equipo, por ejemplo MorfeoMBP16 u NeoMBAAzul."); return; }
  var snap=DETAIL.snapshot(agent);
  Promise.all([
    get(API+"/highscore/daily",function(d){return d||{scores:[]};},{scores:[]}),
    get(API+"/tasks/all?scope=fleet",function(d){return d.tasks||[];},[]),
    get(API+"/fleet/missions",function(d){return d.missions||[];},[]),
    get(API+"/tickets?scope=campo&limit=500",function(d){return d.tickets||[];},[]),
    get(API+"/highscore/history?agent="+encodeURIComponent(agent),function(d){ var value=DETAIL.history(d,agent,ID,Date.now()); if(!value) throw new Error("histórico inválido"); return value; },null)
  ]).then(function(rows){ render({daily:rows[0].value&&rows[0].value.scores?rows[0].value:{scores:[]},tasks:rows[1].value,
      missions:rows[2].value,incidents:rows[3].value,history:rows[4].value,snap:snap,
      available:{daily:rows[0].ok,tasks:rows[1].ok,missions:rows[2].ok,incidents:rows[3].ok,history:rows[4].ok}}); });
})();
</script>
