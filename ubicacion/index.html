<!DOCTYPE html>
<html lang="es">
<head>
<meta name="admiranext-version" content="AdmiraNeXT v.17.09.2026.r8.22:17" />
<script src="/admira-bar.js?v=20260713-r36"></script>
<script src="/auth-gate.js?v=20260811-r14-c7df116ee0bf"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ubicación · invitados en vivo · admira.live</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#0b0e07;--panel:#141a10;--ink:#dfe8d0;--dim:#8fae6a;--amber:#ffdd66;--green:#689840;--vip:#f0c040;--line:rgba(143,174,106,.25)}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  #mapa{position:absolute;top:58px;left:0;right:0;bottom:0;background:#0b0e07}
  #panel{position:absolute;top:70px;left:12px;z-index:900;width:300px;max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #panel h1{font-size:15px;margin:0 0 4px;color:var(--amber);letter-spacing:.06em;text-transform:uppercase}
  #panel .sub{color:var(--dim);font-size:12px;margin-bottom:10px}
  #panel label{display:block;font-size:11px;color:var(--dim);margin-top:8px;text-transform:uppercase;letter-spacing:.08em}
  #panel input{width:100%;box-sizing:border-box;background:#0b0e07;border:1px solid var(--line);color:var(--ink);padding:7px 9px;border-radius:6px;font:inherit}
  #panel button{background:#1f2a16;border:1px solid var(--green);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit;cursor:pointer;margin:8px 6px 0 0}
  #panel button:hover{background:#2a3a1e}
  #panel button.on{background:var(--green);color:#0b0e07}
  #kpi{display:flex;gap:8px;margin-top:10px}
  #kpi div{flex:1;background:#0b0e07;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
  #kpi b{display:block;font-size:20px;color:var(--amber)}
  #kpi span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  #lista{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .inv{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--line);cursor:pointer}
  .inv:hover{background:#0b0e07}
  .inv .dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:0 0 auto}
  .inv.vip .dot{background:var(--vip);box-shadow:0 0 8px var(--vip)}
  .inv.rancio .dot{background:#555;box-shadow:none}
  .inv .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inv .vipb{font-size:9px;background:var(--vip);color:#1a1206;padding:1px 5px;border-radius:4px;font-weight:700;letter-spacing:.08em}
  .inv .age{font-size:11px;color:var(--dim)}
  #hist{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  #hist .fila{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  #hist select{background:#0b0e07;border:1px solid var(--line);color:var(--ink);padding:6px 8px;border-radius:6px;font:inherit}
  #hist .res{font-size:11px;color:var(--dim);margin-top:6px;min-height:14px}
  .inv.sel{background:#1f2a16;border-left:2px solid var(--amber)}
  .inv .km{font-size:10px;color:var(--dim);margin-left:4px}
  #estado{font-size:11px;color:var(--dim);margin-top:8px;min-height:16px}
  #qrbox{display:none;margin-top:10px;background:#fff;padding:10px;border-radius:8px;text-align:center}
  #qrbox #qr{display:inline-block}
  #qrbox .enl{font-size:10px;color:#333;word-break:break-all;margin-top:6px}
  .pin{width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #0b0e07;box-shadow:0 0 10px rgba(0,0,0,.6)}
  .pin.vip{background:var(--vip)} .pin.std{background:var(--green)} .pin.rancio{background:#666}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
  .leaflet-container{background:#0b0e07}
  @media (max-width:720px){#panel{width:calc(100% - 24px);max-height:45%}}
</style>
</head>
<body>
<div id="mapa"></div>
<div id="panel">
  <h1>Ubicación en vivo</h1>
  <div class="sub">Invitados de la AdmiraXperience · posición reportada por su móvil · caduca a los 90 s</div>
  <label for="evento">Evento</label>
  <input id="evento" placeholder="xperience-2026" autocomplete="off" spellcheck="false">
  <div id="kpi"><div><b id="k-vivos">0</b><span>en vivo</span></div><div><b id="k-vip">0</b><span>VIP</span></div><div><b id="k-act">–</b><span>último dato</span></div></div>
  <button id="b-seguir" class="on" title="Encuadra el mapa a los invitados">Seguir</button>
  <button id="b-qr" title="Enlace y QR para un invitado nuevo">Invitar</button>
  <div id="qrbox">
    <div style="color:#333;font-size:11px;margin-bottom:6px"><b>Enlace del invitado</b> · imprímelo en el badge</div>
    <label style="color:#333;text-transform:none;letter-spacing:0;margin:4px 0 2px">Nombre</label>
    <input id="inv-nombre" placeholder="Nombre del invitado" style="background:#f4f4f4;color:#111;border-color:#ccc">
    <label style="color:#333;text-transform:none;letter-spacing:0;margin:6px 0 2px"><input type="checkbox" id="inv-vip" checked style="width:auto"> VIP</label>
    <button id="b-gen" style="background:#689840;color:#fff;border-color:#689840">Generar</button>
    <div id="qr"></div><div class="enl" id="enl"></div>
  </div>
  <div id="hist">
    <div class="fila">
      <button id="b-hist" title="Pinta el recorrido de cada invitado">Recorridos</button>
      <select id="ventana" title="Ventana de tiempo del historial">
        <option value="3600">última hora</option>
        <option value="hoy">hoy</option>
        <option value="86400">24 h</option>
        <option value="604800">7 días</option>
      </select>
    </div>
    <div class="res" id="hist-res"></div>
  </div>
  <div id="lista"></div>
  <div id="estado">conectando…</div>
</div>
<script>
(function(){
  var API = "https://api.yokup.com";
  var TTL_RANCIO_S = 45;   // sin renovar en 45 s se atenúa (caduca del todo a los 90 s)
  var $ = function(s){ return document.querySelector(s); };
  var ev = $("#evento");
  var q = new URLSearchParams(location.search);
  ev.value = (q.get("evento") || localStorage.getItem("ubic-evento") || "xperience-2026").trim();
  ev.addEventListener("change", function(){ ev.value = ev.value.trim(); localStorage.setItem("ubic-evento", ev.value); marcadores = {}; capa.clearLayers(); primera = true; tick(); if (typeof cargaHist === "function") { sel = null; cargaHist(); } });

  var mapa = L.map("mapa", { zoomControl:false, attributionControl:true }).setView([41.3874, 2.1686], 13);
  L.control.zoom({ position:"topright" }).addTo(mapa);   // a la derecha: el panel vive a la izquierda
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(mapa);
  var capa = L.layerGroup().addTo(mapa);
  var marcadores = {}, primera = true, seguir = true, sel = null;
  $("#b-seguir").onclick = function(){ seguir = !seguir; this.classList.toggle("on", seguir); if (seguir) encuadra(); };

  function icono(vip, rancio){ return L.divIcon({ className:"", html:'<div class="pin '+(rancio?"rancio":(vip?"vip":"std"))+'"></div>', iconSize:[18,18], iconAnchor:[9,18], popupAnchor:[0,-16] }); }
  function encuadra(){ var ll=[]; for (var k in marcadores) ll.push(marcadores[k].getLatLng()); if (!ll.length) return; if (ll.length===1) mapa.setView(ll[0], Math.max(mapa.getZoom(),17)); else mapa.fitBounds(L.latLngBounds(ll).pad(0.25)); }
  function pinta(d){
    var vivos = d.invitados || [], vistos = {};
    var nvip = 0, ultimo = null;
    vivos.forEach(function(i){
      vistos[i.invitado] = 1; if (i.vip) nvip++; if (ultimo==null || i.age_s < ultimo) ultimo = i.age_s;
      var rancio = i.age_s > TTL_RANCIO_S;
      var html = "<b>"+esc(i.nombre)+"</b>"+(i.vip?' <span class="inv vipb" style="display:inline">VIP</span>':"")+"<br><span style='color:#8fae6a'>hace "+i.age_s+" s"+(i.acc!=null?" · ±"+i.acc+" m":"")+"</span>";
      var m = marcadores[i.invitado];
      if (!m) { m = L.marker([i.lat,i.lng], { icon:icono(i.vip, rancio), title:i.nombre }).addTo(capa).bindPopup(html); marcadores[i.invitado]=m; }
      else { m.setLatLng([i.lat,i.lng]); m.setIcon(icono(i.vip, rancio)); m.setPopupContent(html); }
      if (i.acc!=null && i.acc>0 && i.acc<400) { if (!m._circ) { m._circ = L.circle([i.lat,i.lng],{radius:i.acc,color:i.vip?"#f0c040":"#689840",weight:1,opacity:.5,fillOpacity:.08}).addTo(capa); } else m._circ.setLatLng([i.lat,i.lng]).setRadius(i.acc); }
    });
    for (var k in marcadores) if (!vistos[k]) { capa.removeLayer(marcadores[k]); if (marcadores[k]._circ) capa.removeLayer(marcadores[k]._circ); delete marcadores[k]; }
    $("#k-vivos").textContent = vivos.length; $("#k-vip").textContent = nvip; $("#k-act").textContent = ultimo==null ? "–" : ultimo+" s";
    var lista = $("#lista"); lista.innerHTML = vivos.length ? "" : "<div style='color:#8fae6a;padding:6px 4px'>Nadie en vivo. Genera un enlace con «Invitar» y ábrelo en el móvil del invitado.</div>";
    vivos.forEach(function(i){
      var row = document.createElement("div"); row.className = "inv"+(i.vip?" vip":"")+(i.age_s>TTL_RANCIO_S?" rancio":"")+(sel===i.invitado?" sel":"");
      var km = (histOn && metrosPor[i.invitado] != null) ? '<span class="km">'+fmtM(metrosPor[i.invitado])+'</span>' : '';
      row.innerHTML = '<span class="dot"></span><span class="n">'+esc(i.nombre)+km+'</span>'+(i.vip?'<span class="vipb">VIP</span>':'')+'<span class="age">'+i.age_s+' s</span>';
      row.onclick = function(){ if (histOn) { selecciona(i.invitado); } var m = marcadores[i.invitado]; if (m && !histOn) { mapa.setView(m.getLatLng(), Math.max(mapa.getZoom(),17)); m.openPopup(); } };
      lista.appendChild(row);
    });
    // con un recorrido seleccionado, «Seguir» no reencuadra: el foco es ese recorrido
    if (vivos.length && (primera || (seguir && !sel))) { encuadra(); primera = false; }
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  // ── RECORRIDOS (historial, FLT-100567) ──────────────────────────────────────────────
  var capaHist = L.layerGroup().addTo(mapa), histOn = false, lineas = {}, metrosPor = {}, histTimer = null;
  function ventana(){
    var v = $("#ventana").value, hasta = Date.now(), desde;
    if (v === "hoy") { var d0 = new Date(); d0.setHours(0,0,0,0); desde = d0.getTime(); } else desde = hasta - Number(v)*1000;
    return { desde:desde, hasta:hasta };
  }
  function estiloLinea(inv, vip){ var s = (sel === inv); return { color: vip ? "#f0c040" : "#689840", weight: s ? 5 : 3, opacity: s ? 1 : (sel ? 0.25 : 0.8) }; }
  function pintaHist(d){
    capaHist.clearLayers(); lineas = {}; metrosPor = {};
    var total = 0, pts = 0;
    (d.recorridos || []).forEach(function(r){
      metrosPor[r.invitado] = r.metros; total += r.metros; pts += r.n;
      var ll = r.puntos.map(function(p){ return [p[0], p[1]]; });
      if (ll.length >= 2) {
        var pl = L.polyline(ll, estiloLinea(r.invitado, r.vip)).addTo(capaHist);
        pl.bindPopup("<b>"+esc(r.nombre)+"</b>"+(r.vip?' <span class="inv vipb" style="display:inline">VIP</span>':"")+"<br><span style='color:#8fae6a'>"+r.n+" puntos · "+fmtM(r.metros)+" · "+new Date(r.desde).toLocaleTimeString()+" → "+new Date(r.hasta).toLocaleTimeString()+"</span>");
        pl.on("click", function(){ selecciona(r.invitado); });
        lineas[r.invitado] = pl;
      }
      // punto de inicio del recorrido
      L.circleMarker(ll[0], { radius:4, color:"#0b0e07", weight:1, fillColor: r.vip ? "#f0c040" : "#689840", fillOpacity:1 }).addTo(capaHist).bindTooltip("inicio · "+esc(r.nombre)+" · "+new Date(r.desde).toLocaleTimeString());
    });
    $("#hist-res").textContent = (d.recorridos||[]).length ? ((d.recorridos.length)+" recorridos · "+pts+" puntos · "+fmtM(total)+(d.recortado?" · (recortado a "+d.filas+" filas)":"")) : "sin historial en esta ventana";
    if (sel) resalta();
  }
  function fmtM(m){ return m >= 1000 ? (m/1000).toFixed(2)+" km" : m+" m"; }
  function resalta(){ for (var k in lineas) lineas[k].setStyle(estiloLinea(k, lineas[k].options.color === "#f0c040")); }
  function selecciona(inv){ sel = (sel === inv) ? null : inv; resalta(); if (sel && lineas[sel]) mapa.fitBounds(lineas[sel].getBounds().pad(0.3)); tickLista(); }
  function cargaHist(){
    var e = ev.value.trim(); if (!e || !histOn) return;
    var w = ventana();
    fetch(API+"/ubicacion/historial?evento="+encodeURIComponent(e)+"&desde="+w.desde+"&hasta="+w.hasta+"&t="+Date.now(), { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (!d.ok) throw new Error(d.error||"no ok"); pintaHist(d); })
      .catch(function(err){ $("#hist-res").textContent = "historial sin respuesta: "+err.message; });
  }
  $("#b-hist").onclick = function(){
    histOn = !histOn; this.classList.toggle("on", histOn);
    if (histOn) { cargaHist(); histTimer = setInterval(cargaHist, 15000); }
    else { clearInterval(histTimer); capaHist.clearLayers(); lineas = {}; metrosPor = {}; sel = null; $("#hist-res").textContent = ""; tickLista(); }
  };
  $("#ventana").onchange = cargaHist;
  var ultimaFoto = null;
  function tickLista(){ if (ultimaFoto) pinta(ultimaFoto); }

  var fallos = 0;
  function tick(){
    var e = ev.value.trim(); if (!e) { $("#estado").textContent = "indica el evento"; return; }
    fetch(API+"/ubicacion/live?evento="+encodeURIComponent(e)+"&t="+Date.now(), { cache:"no-store" })
      .then(function(r){ return r.json(); })
      .then(function(d){ if (!d.ok) throw new Error(d.error||"respuesta no ok"); fallos = 0; ultimaFoto = d; pinta(d); $("#estado").textContent = "en vivo · "+e+" · "+new Date(d.now).toLocaleTimeString(); })
      .catch(function(err){ fallos++; $("#estado").textContent = "sin respuesta de la API ("+fallos+"): "+err.message; });
  }
  tick(); setInterval(tick, 3000);

  // Invitar: enlace + QR para el badge del invitado (la página del invitado NO lleva verja).
  $("#b-qr").onclick = function(){ var b = $("#qrbox"); b.style.display = b.style.display==="block" ? "none" : "block"; };
  var qr = null;
  $("#b-gen").onclick = function(){
    var nombre = $("#inv-nombre").value.trim(); if (!nombre) { $("#inv-nombre").focus(); return; }
    var slug = nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) + "-" + Math.random().toString(36).slice(2,6);
    var url = location.origin + "/ubicacion/invitado?evento=" + encodeURIComponent(ev.value.trim()) + "&invitado=" + encodeURIComponent(slug) + "&nombre=" + encodeURIComponent(nombre) + ($("#inv-vip").checked ? "&vip=1" : "");
    $("#qr").innerHTML = ""; qr = new QRCode($("#qr"), { text:url, width:160, height:160, correctLevel:QRCode.CorrectLevel.M });
    $("#enl").innerHTML = '<a href="'+url+'" target="_blank" rel="noopener">'+esc(url)+'</a>';
  };
})();
</script>
</body>
</html>
