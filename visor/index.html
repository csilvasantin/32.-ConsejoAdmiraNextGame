      el.querySelector(".cab .mis").textContent = f.control ? f.etiquetaModo : "";
      var lat = f.latidoModelo || f.latidoMaquina ? [f.latidoModelo, f.latidoMaquina].filter(Boolean).join(" · ") : "";
      el.querySelector(".modelo").innerHTML = '<span class="punto"></span>' + esc(f.sinDatos || (f.etiquetaModo ? f.etiquetaModo : lat));
      el.querySelector(".hora").textContent = "";
      var bx = el.querySelector(".term"); delete ultimo[k];
      var lineaEq = [f.equipoDeclarado, f.foco].filter(Boolean).join(" · "); // #5824: máquina en vivo, o solo el foco si no hay
      bx.innerHTML = f.control
        ? '<div class="idle"><div style="font-size:22px;font-weight:700;color:var(--c);letter-spacing:.08em">CONTROL CARLOS</div><div style="margin-top:6px">DESKTOP APP · NO MOLESTAR</div><div style="margin-top:6px;opacity:.8">' + esc(lineaEq) + "</div>" + (lat ? '<div style="margin-top:6px;opacity:.7">latido: ' + esc(lat) + "</div>" : "") + (f.sinDatos ? '<div style="margin-top:6px;color:#e0a040">' + esc(f.sinDatos) + "</div>" : "") + "</div>"
        : '<div class="espera">' + esc(f.sinDatos || "sin datos") + "</div>";
      return;
    }
    if (f.estado === "sin_terminal") { el.querySelector(".cab .mis").textContent = ""; el.querySelector(".modelo").innerHTML = '<span class="punto"></span>' + esc(modelo); return; }
    // r31: si el Mac manda el estado (estado-agente.py, el mismo que la cuadrícula), se pinta igual que allí
    if (f.agente) {
      var cong = f.estado === "congelado" ? " · congelado" : "";
      if (f.agente !== "vivo") { pintarIdle(el, f, k, nombre, cong); return; }
      el.classList.remove("ficha-idle", "login", "nosesion");
      var enMision = (f.modelo || "") + " · " + (f.mac || maq) + " · en misión · " + hm() + cong;
      modelo = f.etiquetaModo ? (f.etiquetaModo + " · " + enMision) : enMision;
      el.querySelector(".cab .mis").textContent = f.linea || ("▶ " + (f.mision || ""));
    } else { el.querySelector(".cab .mis").textContent = ""; el.classList.remove("ficha-idle"); }
    el.querySelector(".modelo").innerHTML = '<span class="punto"></span>' + esc(modelo);
    el.querySelector(".hora").textContent = f.estado === "esperando" ? "" : (f.estado === "congelado" ? "congelado · " : "") + "cambio " + hora(f.cambio);
    var box = el.querySelector(".term");
    if (box.querySelector(".idle")) { box.innerHTML = "<pre></pre>"; delete ultimo[k]; }
    if (f.estado === "esperando" || !f.lineas) {
      box.innerHTML = '<div class="espera">esperando sesión<br/>«' + esc(f.sesion) + "» en " + esc(maq) + "…</div>";
      delete ultimo[k]; return;
    }
    if (!box.querySelector("pre")) box.innerHTML = "<pre></pre>";
    var firma = f.cambio + ":" + f.lineas.length + ":" + (f.lineas[f.lineas.length - 1] || "");
    if (ultimo[k] === firma) return; ultimo[k] = firma;
    el.dataset.cols = f.ancho || 120;
    box.querySelector("pre").innerHTML = f.lineas.map(ansi).join("\n");
    ajustar(el);
  }
  function pintarIdle(el, f, k, nombre, cong) {
    el.classList.add("ficha-idle"); el.classList.toggle("login", f.agente === "login"); el.classList.toggle("nosesion", f.agente === "nosesion"); el.classList.toggle("pendiente", f.agente === "pendiente");
    var arte = (f.arte && f.arte.length ? f.arte : ROTULOS[claveRot(nombre)] || (f.rotulo && f.rotulo.length ? f.rotulo : null)) || [nombre.toUpperCase()];
    var palabra = f.etiqueta || (f.agente === "login" ? "Login pendiente" : f.agente === "nosesion" ? "Sin sesión" : f.agente === "pendiente" ? "Pendiente sin trabajar" : "Idle");
    var info = (f.etiquetaModo ? f.etiquetaModo + " · " : "") + (f.modelo || "") + " · " + (f.mac || MAQUINAS[f.host] || f.host) + " · " + palabra + " · " + hm() + cong;
    var mis = f.linea || ("última misión: " + (f.mision || "sin misiones registradas"));
    var viejo = f.viejo || "";
    var firma = "idle:" + palabra + ":" + info + ":" + mis + ":" + viejo + ":" + arte.join("|");
    if (ultimo[k] === firma) return; ultimo[k] = firma;
    el.dataset.acols = Math.max.apply(null, arte.map(function (l) { return l.length; })); el.dataset.afilas = arte.length;
    el.querySelector(".term").innerHTML = '<div class="idle"><pre class="arte"></pre><div class="palabra"></div><div class="info"></div><div class="mis"></div><div class="viejo"></div></div>';
    var q = function (c) { return el.querySelector(".idle " + c); };
    q(".arte").textContent = arte.join("\n"); q(".palabra").textContent = palabra; q(".info").textContent = info; q(".mis").textContent = mis; q(".viejo").textContent = viejo;
    q(".info").title = info; q(".mis").title = mis;
    ajustarIdle(el);
  }
  function puntos() {
    if (getComputedStyle($pts).display === "none") return;
    var i = Math.round($rej.scrollLeft / Math.max(1, $rej.clientWidth));
    $pts.innerHTML = orden.map(function (_, j) { return "<i" + (j === i ? ' class="on"' : "") + "></i>"; }).join("");
  }
  $rej.addEventListener("scroll", puntos, { passive: true });
  window.addEventListener("resize", function () { Object.keys(fichas).forEach(function (k) { ajustar(fichas[k]); }); puntos(); });

  var fallos = 0, t0;
  function tick() {
    t0 = Date.now();
    fetch("/api/visor/pane" + (A2.length ? "?a=" + encodeURIComponent(A2.join(",")) : G6 ? "?g=6" : ""), { headers: { "X-Visor-Key": llave }, cache: "no-store" }).then(function (r) {
      if (r.status === 401) { try { localStorage.removeItem("visorLlave"); } catch (e) {} document.getElementById("llave").innerHTML = "<div class=\"msg\">La llave de este visor ya no vale (revocada o caducada).<br/>Pide un enlace nuevo a GrokBot.</div>"; document.getElementById("llave").style.display = "flex"; throw new Error("401"); }
      return r.json();
    }).then(function (d) {
      if (!d || !d.ok) throw new Error("respuesta");
      fallos = 0;
      var claves = d.fichas.map(function (f) { return f.host + "/" + f.sesion; });
      Object.keys(fichas).forEach(function (k) { if (claves.indexOf(k) < 0) { fichas[k].remove(); delete fichas[k]; } });
      d.fichas.forEach(pintar); orden = claves;
      claves.forEach(function (k) { $rej.appendChild(fichas[k]); });
      var vivos = d.fichas.filter(function (f) { return f.estado === "vivo" || f.estado === "desktop"; }).length;
      $est.textContent = vivos + "/" + d.fichas.length + " en vivo · " + hora(d.ahora) + " · " + (Date.now() - t0) + " ms" + ((d.avisos && d.avisos.length) ? " · ⚠ " + d.avisos.join(" · ") : "");
      puntos();
      setTimeout(tick, document.hidden ? 15000 : CADA_MS);
    }).catch(function (e) {
      if (String(e && e.message) === "401") return;
      fallos++; $est.textContent = "sin conexión (reintento)…";
      setTimeout(tick, Math.min(30000, CADA_MS * (1 + fallos)));
    });
  }
  tick();
})();
</script>
