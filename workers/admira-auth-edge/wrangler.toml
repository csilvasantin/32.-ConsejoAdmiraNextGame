name = "admira-auth-edge"
main = "src/index.js"
compatibility_date = "2026-08-11"
workers_dev = false

[[routes]]
pattern = "www.admira.live/auth/*"
zone_name = "admira.live"

[[durable_objects.bindings]]
name = "AUTH_STORE"
class_name = "AuthStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthStore"]
